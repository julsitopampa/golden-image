name: Packer Build

on:
  push:
    branches: [main]
    paths:
      - "**.pkr.hcl"
      - "**.pkrvars.hcl"
      - "http/**"
      - "ansible/**"
      - ".github/workflows/*"
  pull_request:
    branches: [main]
    paths:
      - "**.pkr.hcl"
      - "http/**"
      - "ansible/**"
      - ".github/workflows/*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PACKER_VERSION: "1.15.3"

jobs:
  validate:
    name: Validate Packer Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Packer
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Initialize Packer
        run: packer init .

      - name: Format check
        run: packer fmt -check -diff .

      - name: Validate templates
        env:
          PKR_VAR_proxmox_api_url: "https://stub:8006"
          PKR_VAR_proxmox_api_token_id: "stub@pve!stub"
          PKR_VAR_proxmox_api_token_secret: "stub"
        run: packer validate .

  build:
    name: Build Images
    runs-on: self-hosted-arc
    environment: prod
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Packer
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Initialize Packer
        run: packer init .

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          pip install \
            "ansible-core==2.21.5"

      - name: Install Ansible Galaxy dependencies
        run: |
          ansible-galaxy role install -r ansible/requirements.yml -p ansible/roles
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Build images
        env:
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: PACKER_LOG=1 packer build -force .
