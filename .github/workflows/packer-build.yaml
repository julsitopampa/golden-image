name: Packer Build

on:
  push:
    branches: [main]
    paths:
      - "**.pkr.hcl"
      - "**.pkrvars.hcl"
      - "http/**"
      - ".github/workflows/*"
  pull_request:
    branches: [main]
    paths:
      - "**.pkr.hcl"
      - ".github/workflows/*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PACKER_VERSION: "1.15.3"

jobs:
  validate:
    name: Validate Packer Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Packer
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Initialize Packer
        run: packer init .

      - name: Format check
        run: packer fmt -check -diff .

      - name: Validate templates
        env:
          PKR_VAR_proxmox_api_url: "https://stub:8006"
          PKR_VAR_proxmox_api_token_id: "stub@pve!stub"
          PKR_VAR_proxmox_api_token_secret: "stub"
        run: packer validate .

  build:
    name: Build Images
    runs-on: self-hosted-arc
    environment: prod
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Packer
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Initialize Packer
        run: packer init .

      - name: Build images
        env:
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: PACKER_LOG=1 packer build -force .