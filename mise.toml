[hooks]
enter = "mise install --quiet"
postinstall = "hk install --mise"

[env]
HK_MISE = 1

[settings]
lockfile = true
lockfile_platforms = ["linux-x64"]

[settings.aqua]
cosign = true
slsa = true
github_attestations = true

[tools]
actionlint = "latest"
betterleaks = "latest"
hk = "latest"
packer = "latest"
yamlfmt = "latest"
